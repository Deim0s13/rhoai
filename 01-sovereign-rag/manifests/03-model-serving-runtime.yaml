# 03-model-serving-runtime.yaml
# Registers vLLM as a serving runtime in RHOAI.
#
# UPDATED (RHOAI 3.4): added --served-model-name so API calls use a
# clean identifier (granite-3-3-8b-instruct) rather than the raw
# /mnt/models path. This aligns with UC02 convention and makes notebook
# API calls more readable. Update notebooks/02-rag-query.ipynb Cell 2
# MODEL_NAME to match this value.
#
# FIXED (UC01): switched from quay.io/rh-aiservices-bu/vllm-openai-ubi9:0.6.2
# to registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.5 — Red Hat AI Inference
# Server, the supported, versioned, enterprise-grade vLLM distribution.
# Community Quay tags are not stable over time; that tag no longer exists.
#
# VALIDATE: confirm the RHAIIS image tag is still current on first deploy:
#   oc get is -n redhat-ods-applications | grep vllm
# If a newer tag is available, update the image field accordingly.
#
# FIXED (UC01): this ServingRuntime is the single source of truth for all
# vLLM serving arguments. The InferenceService must not set any args —
# KServe merges both lists, producing duplicate/conflicting flags that
# the RHAIIS CLI rejects.
#
# FIXED (UC01): /mnt/models is passed as an explicit positional argument.
# KServe does NOT auto-inject the model path for this runtime/KServe
# version combination. Without it, vllm serve falls through to trying to
# resolve a default model from HuggingFace Hub, which fails correctly
# because outgoing traffic is disabled in the container.
#
# GPU: sized for NVIDIA L4 (24GB VRAM, bfloat16, 0.85 utilisation).
# Granite 3.3 8B in bfloat16 uses ~16GB VRAM, leaving comfortable headroom.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  namespace: sovereign-rag
  labels:
    app.kubernetes.io/part-of: rhoai-presales-lab
  annotations:
    openshift.io/display-name: "vLLM Runtime (Red Hat AI Inference Server)"
spec:
  multiModel: false
  supportedModelFormats:
    - name: pytorch
      version: "1"
      autoSelect: true
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.5 # VALIDATE currency on first deploy
      command: ["vllm", "serve"]
      args:
        - "/mnt/models"
        - "--port=8080"
        - "--dtype=bfloat16"
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.85"
        - "--served-model-name=granite-3-3-8b-instruct"
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
