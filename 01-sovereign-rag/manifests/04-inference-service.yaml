# 04-inference-service.yaml
# Deploys the model using the vLLM runtime defined above.
#
# UPDATED (RHOAI 3.4): model changed from granite-3.1-8b-instruct to
# granite-3.3-8b-instruct for consistency with UC02 and to use the current
# Red Hat-supported Granite model. Memory footprint is comparable; the L4
# (24GB VRAM) handles either comfortably at bfloat16 with the gpu-memory-
# utilization=0.85 setting in the ServingRuntime.
#
# FIXED (UC01): storageUri points at self-hosted MinIO (bucket: models).
# Credentials and endpoint are resolved via the ServiceAccount, which
# references the MinIO data connection secret (06-data-connection.yaml).
#
# FIXED (UC01): removed args from model:. KServe merges ServingRuntime
# container args with InferenceService model args. All serving arguments
# live in the ServingRuntime (03-model-serving-runtime.yaml) as the single
# source of truth.
#
# FIXED (UC01): RawDeployment mode. Default Serverless mode requires the
# namespace to be enrolled in the cluster Service Mesh member roll —
# sovereign-rag is not enrolled, and enrolling it is unnecessary complexity.
#
# GPU NOTE:
# Configured for NVIDIA L4 (24GB VRAM).
# Verify the node label on your cluster before deploying:
#   oc get nodes -o json | jq -r '.items[].metadata.labels["nvidia.com/gpu.product"]' | grep -v null
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-instruct
  namespace: sovereign-rag
  labels:
    app.kubernetes.io/part-of: rhoai-presales-lab
  annotations:
    serving.kserve.io/deploymentMode: "RawDeployment"
spec:
  predictor:
    serviceAccountName: minio-sa
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L4 # VALIDATE: confirm label on your cluster
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    model:
      modelFormat:
        name: pytorch
      runtime: vllm-runtime
      storageUri: "s3://models/granite-3.3-8b-instruct"
      resources:
        requests:
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
