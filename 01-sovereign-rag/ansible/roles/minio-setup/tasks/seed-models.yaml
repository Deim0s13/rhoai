# seed-models.yaml
# Downloads Granite 3.3 8B Instruct from HuggingFace and uploads to MinIO.
#
# UPDATED (RHOAI 3.4): model changed from granite-3.1-8b-instruct to
# granite-3.3-8b-instruct for consistency with UC02.
#
# FIXED (UC01): switched from deprecated huggingface-cli (a no-op stub)
# to the hf CLI. The old command silently succeeded while downloading
# nothing, producing an empty bucket that only failed three steps later
# inside the InferenceService init container.
#
# FIXED (UC01): idempotency check now uses mc stdout content, not exit
# code. mc ls returns rc=0 even on an empty/nonexistent prefix — checking
# rc alone meant the download was silently skipped on every run.
#
# FIXED (UC01): explicit verification after both download and upload.
# Never trust silent success on hf or mc commands.

- name: Check if model already seeded
  ansible.builtin.command: >
    mc ls sovereign-rag/models/granite-3.3-8b-instruct
  register: model_check
  failed_when: false
  changed_when: false

- name: Determine if model is actually present
  ansible.builtin.set_fact:
    model_already_seeded: "{{ model_check.stdout | trim | length > 0 }}"

- name: Download Granite 3.3 8B Instruct from HuggingFace
  ansible.builtin.command: >
    hf download
    ibm-granite/granite-3.3-8b-instruct
    --local-dir /tmp/granite-3.3-8b-instruct
  environment:
    HF_TOKEN: "{{ hf_token }}"
  when: not model_already_seeded

- name: Verify the download actually produced files
  ansible.builtin.find:
    paths: /tmp/granite-3.3-8b-instruct
    patterns: "*.safetensors"
  register: downloaded_files
  when: not model_already_seeded
  failed_when: not model_already_seeded and downloaded_files.matched == 0

- name: Upload model weights to MinIO
  ansible.builtin.command: >
    mc cp --recursive
    /tmp/granite-3.3-8b-instruct/
    sovereign-rag/models/granite-3.3-8b-instruct/
  when: not model_already_seeded
  register: model_upload
  failed_when: model_upload.rc != 0

- name: Verify upload succeeded
  ansible.builtin.command: >
    mc ls sovereign-rag/models/granite-3.3-8b-instruct
  register: upload_check
  changed_when: false
  failed_when: upload_check.stdout | trim | length == 0

- name: Clean up local model download
  ansible.builtin.file:
    path: /tmp/granite-3.3-8b-instruct
    state: absent
  when: not model_already_seeded
