# ADR-0003 Phase 2. A dedicated GatewayClass for MaaS, per Red Hat's
# documented prerequisite ("You have created a GatewayClass resource
# configured for the OpenShift Gateway Controller"). Not reusing
# data-science-gateway-class or openshift-ai-inference, both already
# tied to specific existing purposes on this cluster; controller name
# confirmed live (2026-07-28) as the pattern both existing classes use
# successfully.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: maas-gateway-class
spec:
  controllerName: openshift.io/gateway-controller/v1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    # Prevents the ODH Model Controller from overriding MaaS-managed
    # authorization on this Gateway. Required per RHOAI 3.4 MaaS docs;
    # absence is silent, authorization simply does not behave as configured.
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: maas-gateway-class
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      # No hostname deliberately. Wildcard DNS for *.apps points at the
      # default ingress router, not at this gateway's own load balancer, so
      # a hostname here routes traffic to the wrong LB (confirmed
      # 2026-07-31: *.apps resolves to the router, the gateway has its own
      # ELB). Clients read the address from .status.addresses instead.
      # The wildcard cert will not match that address, so lab clients use
      # curl -k. In production this gets a DNS record (or a Kuadrant
      # DNSPolicy, the dns-operator is installed) and a matching hostname.
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: cert-manager-ingress-cert
      allowedRoutes:
        namespaces:
          # Namespaces must be explicitly labelled to publish through the
          # governed gateway. Which teams may expose models under
          # governance is a control in its own right, not an open door.
          # NOTE: this applies to the platform's own maas-api-route too;
          # redhat-ods-applications must carry the label or /v1/models
          # returns 404. Phase 3 applies it.
          from: Selector
          selector:
            matchLabels:
              maas.opendatahub.io/publish: "true"
