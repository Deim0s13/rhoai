apiVersion: v1
kind: Namespace
metadata:
  name: maas-models
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-06b
  namespace: maas-models
spec:
  model:
    uri: hf://Qwen/Qwen3-0.6B
    name: Qwen/Qwen3-0.6B
  replicas: 1
  # Opt-in to MaaS: without this gateway ref the model uses the default
  # KServe gateway and no MaaS policy applies to it.
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: qwen3-06b
  # Must be co-located with the model: modelRef has kind and name only,
  # no namespace field.
  namespace: maas-models
spec:
  modelRef:
    kind: LLMInferenceService
    name: qwen3-06b
