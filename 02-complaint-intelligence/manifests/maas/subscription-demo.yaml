apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo-subscription
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: system:authenticated
  priority: 1
  modelRefs:
    - name: qwen3-06b
      namespace: maas-models
      tokenRateLimits:
        # Deliberately small so exhaustion is demonstrable in seconds.
        # window units: s, m, h only. Days are not supported, use 24h.
        - limit: 500
          window: 1m
      billingRate:
        perToken: "0.000002"
  # Chargeback primitives are native to the CRD, not assembled from
  # metrics afterwards. This is the Economics pillar in configuration.
  tokenMetadata:
    costCenter: "ACME-CC-4471"
    organizationId: "acme-bank-retail"
    labels:
      useCase: "UC02-complaint-intelligence"
      businessUnit: "customer-remediation"
      environment: "presales-lab"
