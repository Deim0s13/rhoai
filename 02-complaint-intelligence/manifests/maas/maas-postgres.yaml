apiVersion: v1
kind: Namespace
metadata:
  name: maas-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-postgres-data
  namespace: maas-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgres
  namespace: maas-platform
  labels:
    app: maas-postgres
    app.kubernetes.io/part-of: rhoai-presales-lab
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC, same reasoning as MinIO
  selector:
    matchLabels:
      app: maas-postgres
  template:
    metadata:
      labels:
        app: maas-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef: { name: maas-postgres-credentials, key: username }
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: maas-postgres-credentials, key: password }
            - name: POSTGRESQL_DATABASE
              value: maas
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  namespace: maas-platform
spec:
  selector:
    app: maas-postgres
  ports:
    - port: 5432
      targetPort: 5432
