# NOT a MaaS resource. Corrective rollback: a blanket install-plan
# approval during ADR-0003 Phase 1 (2026-07-28) accidentally upgraded
# Service Mesh from v3.1.0 to v3.4.0, three minor versions past what
# RHOAI 3.4.2's own gateway-management controller expects (it pins the
# Istio CR to v1.26.2, which the v3.4.0 operator refuses to install as
# end-of-life). This pins the subscription back to v3.1.0. See
# DEPLOYMENT-LOG-2026-07-28 for the full incident.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-operators
spec:
  channel: stable
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: servicemeshoperator3.v3.1.0
  installPlanApproval: Manual
