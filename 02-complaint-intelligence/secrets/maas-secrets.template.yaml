apiVersion: v1
kind: Secret
metadata:
  name: maas-postgres-credentials
  namespace: maas-platform
stringData:
  username: maas
  password: ${MAAS_DB_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: redhat-ods-applications
stringData:
  # Single key, per upstream MaaS docs. sslmode=disable because this is a
  # plain in-cluster PostgreSQL with no TLS listener; the documented example
  # uses sslmode=require, which assumes a TLS-enabled database.
  DB_CONNECTION_URL: "postgresql://maas:${MAAS_DB_PASSWORD}@maas-postgres.maas-platform.svc.cluster.local:5432/maas?sslmode=disable"
